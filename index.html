<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Before - Katy Perry</title>
<style>

body {
  margin: 0;
  min-height: 100vh;
  background: #ff7ae6;
  display: grid;
  place-items: center;
}



.stage {
  position: relative;
  width: min(100%, calc(100vh * 1.76));
  aspect-ratio: 1426 / 806;
}


.stage img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}


.open-eye {
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}


.eye-link {
  position: absolute;
  left: 30%;
  top: 40%;
  width: 48%;
  height: 46%;
  border-radius: 50%;
  cursor: pointer;
}


.eye-link:hover ~ .open-eye,
.eye-link:focus-visible ~ .open-eye {
  opacity: 1;
}

.eye-link:focus-visible {
  outline: 3px solid #ff7ae6;
}


.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

@media (prefers-reduced-motion: reduce) {
  .open-eye { transition: none; }
}
</style>
</head>
<body>
  <h1 class="sr-only">Katy Perry, The Night Before, U.S. Tour 2027</h1>

  <main class="stage">
    <img class="closed-eye" src="screen1.png" alt="Glitter eyeshadow on a closed eye over blurred party dancers. The Night Before. Wake up party girl.">
    <a class="eye-link" href="page3.html" aria-label="Get your tickets and see the tour dates"></a>
    <img class="open-eye" src="screen2.png" alt="The eye is open and reads Get Ur Tickets." aria-hidden="true">
  </main>
</body>
</html>
