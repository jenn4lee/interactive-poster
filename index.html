<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #ff7ae6;
    display: grid;
    place-items: center;
  }

  .stage {
    position: relative;
    width: min(100%, calc(100vh * 1.76));
    width: min(100%, calc(100dvh * 1.76));
    aspect-ratio: 1426 / 806;
  }

  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .open-eye {
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .eye-link {
    position: absolute;
    left: 30%;
    top: 40%;
    width: 48%;
    height: 46%;
    border-radius: 50%;
    cursor: pointer;
  }

  .eye-link:hover ~ .open-eye,
  .eye-link:focus-visible ~ .open-eye {
    opacity: 1;
  }

  .eye-link:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .open-eye { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <img class="closed-eye" src="screen1.jpg" alt="A closed eye">
    <a class="eye-link" href="page3.html">
      <span class="sr-only">Open the eye and continue</span>
    </a>
    <img class="open-eye" src="screen2.jpg" alt="" aria-hidden="true">
  </main>
</body>
</html>
