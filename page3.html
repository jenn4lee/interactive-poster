<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --night:#120c18;
  --bg-opacity:.6;                       
  --card:#ebe9e3;
  --script:"Mrs Saint Delafield","Snell Roundhand","Segoe Script",cursive;
  --mono:"Space Mono",ui-monospace,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--night);overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:-4%;background:url(bg.jpg) center/cover no-repeat;opacity:var(--bg-opacity);z-index:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


.stage{position:relative;z-index:1;width:min(100%,calc(100vh * 1.766));max-width:1710px;margin:0 auto;aspect-ratio:1710/968;container-type:inline-size}
.polaroid{
  --r:0deg;
  position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1%);
  margin:0;display:flex;flex-direction:column;aspect-ratio:555/670;container-type:inline-size;background:linear-gradient(160deg,#f1efe9,var(--card));
  box-shadow:0 .6cqw 2cqw rgb(0 0 0 / .55);
  transform:translate(-50%,-50%) rotate(var(--r));
  transition:transform .4s cubic-bezier(.3,1.5,.5,1),box-shadow .4s;
  cursor:pointer;outline:none;
}
.photo{display:block;flex:none;width:calc(100% - 14.4cqw);margin:6.8cqw 7.2cqw 0;aspect-ratio:480/494;object-fit:cover;background:#222}
figcaption{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 3cqw 1cqw;text-align:center;color:#2a2230;font-family:var(--script);font-size:min(12.5cqw,calc(84cqw/(var(--n)*.34)));line-height:1;white-space:nowrap}
figcaption small{display:block;margin-top:1cqw;font:3.6cqw/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;opacity:.7;white-space:normal}


.polaroid:hover,.polaroid:focus,.polaroid:focus-visible{
  transform:translate(-50%,-50%) rotate(0deg) scale(1.1);z-index:20!important;
  box-shadow:0 1.6cqw 3.4cqw rgb(0 0 0 / .7)}
.polaroid:focus-visible{outline:3px solid #ffd1f0;outline-offset:6px}

.p-nyc{--x:19;--y:41;--w:21;--r:-10deg;z-index:1}
.p-bos{--x:34;--y:69;--w:21;--r:-3deg;z-index:2}
.p-la{--x:49;--y:31;--w:21;--r:8deg;z-index:4}
.p-phl{--x:62;--y:67;--w:21;--r:-7deg;z-index:1}
.p-chi{--x:77;--y:37;--w:21;--r:3deg;z-index:3}



@media (max-width:760px){
  .stage{aspect-ratio:auto;container-type:normal;display:flex;flex-wrap:wrap;justify-content:center;padding:2rem .5rem 4rem}
  .polaroid{position:relative;left:auto;top:auto;width:46%;margin:-1rem -.4rem;transform:rotate(var(--r))}
  .polaroid:hover,.polaroid:focus{transform:rotate(0deg) scale(1.06)}
  .polaroid{box-shadow:0 .4rem 1rem rgb(0 0 0 / .55)}
}
@media (prefers-reduced-motion:reduce){.polaroid{transition:none}}
</style>
</head>
<body>
<main class="stage">
  <figure class="polaroid p-nyc" tabindex="0"><img class="photo" src="nyc.jpg">
    <figcaption style="--n:12">New York, NY<small>06.04.27 · Madison Square Garden</small></figcaption></figure>

  <figure class="polaroid p-bos" tabindex="0"><img class="photo" src="boston.jpg" style="object-position:55% 50%">
    <figcaption style="--n:10">Boston, MA<small>06.07.27 · TD Garden</small></figcaption></figure>

  <figure class="polaroid p-la" tabindex="0"><img class="photo" src="la.jpg" style="object-position:70% 50%">
    <figcaption style="--n:15">Los Angeles, CA<small>06.22.27 · Kia Forum</small></figcaption></figure>

  <figure class="polaroid p-phl" tabindex="0"><img class="photo" src="philly.jpg" style="object-position:48% 50%">
    <figcaption style="--n:16">Philadelphia, PA<small>06.10.27 · Wells Fargo Center</small></figcaption></figure>
    
  <figure class="polaroid p-chi" tabindex="0"><img class="photo" src="chicago.jpg" style="object-position:45% 50%">
    <figcaption style="--n:11">Chicago, IL<small>06.14.27 · United Center</small></figcaption></figure>
</main>
</body>
</html>
